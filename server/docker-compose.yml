services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cad_simulator
      POSTGRES_PASSWORD: cad_simulator
      POSTGRES_DB: cad_simulator
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cad_simulator']
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
